<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weltkarte — Länderinformationen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg-deep: #0a0e14;
    --bg-card: #121820;
    --bg-card-hover: #1a2230;
    --ocean: #0d1520;
    --land: #2a3444;
    --land-hover: #3d5068;
    --land-stroke: #1a2230;
    --right-drive: #2a5040;
    --left-drive: #503a2a;
    --right-drive-hover: #3a7058;
    --left-drive-hover: #705a3a;
    --accent: #e8c47c;
    --accent-dim: #c4975a;
    --text: #e0ddd6;
    --text-dim: #8a8880;
    --text-muted: #5a5850;
    --border: #2a2e34;
    --shadow: rgba(0,0,0,0.5);
    --glass: rgba(18,24,32,0.92);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
  }

  /* ── Header ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, var(--bg-deep) 60%, transparent);
    pointer-events: none;
  }
  header > * { pointer-events: auto; }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo svg { width: 22px; height: 22px; fill: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* ── Toggle Switch ── */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    padding: 6px 14px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .toggle-wrap:hover { border-color: var(--accent-dim); color: var(--text); }
  .toggle-wrap.active { border-color: var(--accent); color: var(--accent); }

  .toggle-track {
    width: 36px; height: 20px;
    border-radius: 10px;
    background: var(--land);
    position: relative;
    transition: background 0.3s;
  }
  .toggle-wrap.active .toggle-track { background: var(--accent-dim); }
  .toggle-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    position: absolute;
    top: 2px; left: 2px;
    transition: all 0.3s;
  }
  .toggle-wrap.active .toggle-thumb { left: 18px; background: var(--accent); }

  .legend {
    display: flex; gap: 14px;
    font-size: 12px; font-weight: 500;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .legend.visible { opacity: 1; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 3px;
  }
  .legend-dot.right { background: var(--right-drive); border: 1px solid var(--right-drive-hover); }
  .legend-dot.left { background: var(--left-drive); border: 1px solid var(--left-drive-hover); }

  /* ── Map Container ── */
  #map-container {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: var(--ocean);
    cursor: grab;
  }
  #map-container:active { cursor: grabbing; }

  #map-container svg {
    width: 100%;
    height: 100%;
  }

  #countries-group, #graticule {
    transform-origin: 0 0;
    will-change: transform; /* Sagt dem Browser: Halte die GPU bereit! */
  }

  /* ── Country paths ── */
  .country {
    fill: var(--land);
    stroke: var(--land-stroke);
    stroke-width: 0.5;
    cursor: pointer;
    transition: fill 0.25s ease, stroke 0.25s ease, filter 0.25s ease;
  }
  .country:hover {
    fill: var(--land-hover);
    stroke: var(--accent-dim);
    stroke-width: 1;
    filter: drop-shadow(0 0 6px rgba(232,196,124,0.15));
  }
  #map-container.is-dragging .country {
    pointer-events: none;
  }

  /* Driving side colors */
  .driving-mode .country[data-driving="right"] { fill: var(--right-drive); }
  .driving-mode .country[data-driving="left"] { fill: var(--left-drive); }
  .driving-mode .country[data-driving="right"]:hover { fill: var(--right-drive-hover); }
  .driving-mode .country[data-driving="left"]:hover { fill: var(--left-drive-hover); }

  /* ── Hover Tooltip ── */
  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px var(--shadow);
    white-space: nowrap;
  }
  #tooltip.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .tooltip-flag {
    font-size: 28px;
    line-height: 1;
  }
  .tooltip-flag img {
    width: 36px; height: 24px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .tooltip-info { display: flex; flex-direction: column; gap: 2px; }
  .tooltip-name {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--text);
  }
  .tooltip-tld {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .tooltip-driving {
    font-size: 11px;
    color: var(--text-dim);
  }
  .tooltip-driving .side-icon {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .tooltip-driving .side-icon.right { background: var(--right-drive-hover); }
  .tooltip-driving .side-icon.left { background: var(--left-drive-hover); }

  /* ── Info Panel (Overlay) ── */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.35s;
  }
  #overlay.open {
    background: rgba(0,0,0,0.65);
    pointer-events: auto;
  }

  #info-panel {
    width: min(640px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 24px 80px var(--shadow);
    transform: translateY(30px) scale(0.95);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #overlay.open #info-panel {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  /* Scrollbar */
  #info-panel::-webkit-scrollbar { width: 6px; }
  #info-panel::-webkit-scrollbar-track { background: transparent; }
  #info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .panel-header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 24px 28px 20px;
    background: linear-gradient(180deg, var(--bg-card) 85%, transparent);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .panel-title-area { display: flex; align-items: center; gap: 16px; }
  .panel-flag {
    font-size: 42px;
    line-height: 1;
  }
  .panel-flag img {
    width: 56px; height: 38px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    line-height: 1.2;
  }
  .panel-subtitle {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .close-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card-hover);
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .close-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

  .panel-body { padding: 0 28px 28px; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .info-card {
    padding: 14px 16px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.2s;
  }
  .info-card:hover { border-color: var(--accent-dim); }
  .info-card.full { grid-column: 1 / -1; }
  .info-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .info-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .info-value.accent { color: var(--accent); }
  .info-value.small { font-size: 14px; font-weight: 400; line-height: 1.5; }

  .driving-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .driving-badge.right { background: var(--right-drive); color: #8fd4b0; }
  .driving-badge.left { background: var(--left-drive); color: #e4c08a; }
  .driving-badge svg { width: 16px; height: 16px; }

  .panel-images {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  /* Spezifisches Layout für das Kennzeichen (volle Breite) */
  .panel-plate-wrap {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-deep);
    margin-top: 12px;
  }
  .panel-plate-wrap img {
    width: 100%;
    height: auto;
    max-height: 120px; /* Verhindert, dass hohe Kennzeichen den halben Bildschirm füllen */
    object-fit: contain; /* Zeigt das Bild komplett ohne Beschnitt */
    display: block;
  }

  .panel-img-wrap {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-deep);
  }
  .panel-img-wrap img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }
  .panel-img-caption {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .panel-section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: var(--accent);
    margin: 20px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .panel-additional {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .panel-additional a { color: var(--accent); }

  /* ── Zoom Controls ── */
  .zoom-controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .zoom-btn {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .zoom-btn:hover { border-color: var(--accent-dim); color: var(--accent); background: var(--bg-card-hover); }

  /* ── Search ── */
  .search-wrap {
    position: relative;
  }
  .search-input {
    width: 200px;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: all 0.3s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent-dim); width: 260px; }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: none;
    max-height: 240px;
    overflow-y: auto;
  }
  .search-results.open { display: block; }
  .search-result-item {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .search-result-item:hover { background: var(--bg-card-hover); }
  .search-result-item .sr-flag { font-size: 16px; }
  .search-result-item .sr-name { color: var(--text); }
  .search-result-item .sr-tld { color: var(--accent); font-weight: 600; font-size: 11px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .logo { font-size: 18px; }
    .search-input { width: 140px; }
    .search-input:focus { width: 180px; }
    .info-grid { grid-template-columns: 1fr; }
    .toggle-wrap span.hide-mobile { display: none; }
    #info-panel { border-radius: 12px; }
    .panel-header { padding: 18px 20px 14px; }
    .panel-body { padding: 0 20px 20px; }
    .panel-title { font-size: 22px; }
  }

  /* ── Graticule ── */
  .graticule {
    fill: none;
    stroke: rgba(255,255,255,0.03);
    stroke-width: 0.3;
  }
</style>
</head>
<body>

<!-- Data Scripts (loaded before app) -->
<script src="data/map-paths.js"></script>
<script src="data/countries.js"></script>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="4" ry="10" fill="none" stroke="currentColor" stroke-width="1"/><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="0.8"/><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="0.5"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="0.5"/></svg>
    Weltkarte
  </div>
  <div class="controls">
    <div class="legend" id="legend">
      <div class="legend-item"><div class="legend-dot right"></div>Rechtsverkehr</div>
      <div class="legend-item"><div class="legend-dot left"></div>Linksverkehr</div>
    </div>
    <div class="toggle-wrap" id="driving-toggle" onclick="toggleDriving()">
      <span class="hide-mobile">Verkehrsseite</span>
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Land suchen…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
</header>

<div id="map-container">
  <svg id="world-map" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet">
    <!-- Graticule lines for visual texture -->
    <g class="graticule" id="graticule"></g>
    <!-- Country paths inserted by JS -->
    <g id="countries-group"></g>
  </svg>
</div>

<div id="tooltip">
  <div class="tooltip-flag" id="tooltip-flag"></div>
  <div class="tooltip-info">
    <div class="tooltip-name" id="tooltip-name"></div>
    <div class="tooltip-tld" id="tooltip-tld"></div>
    <div class="tooltip-driving" id="tooltip-driving"></div>
  </div>
</div>

<div id="overlay" onclick="closePanel(event)">
  <div id="info-panel">
    <div class="panel-header">
      <div class="panel-title-area">
        <div class="panel-flag" id="panel-flag"></div>
        <div>
          <div class="panel-title" id="panel-title"></div>
          <div class="panel-subtitle" id="panel-subtitle"></div>
        </div>
      </div>
      <button class="close-btn" onclick="closePanel(event, true)">&times;</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" onclick="zoomMap(1.3)" title="Vergrößern">+</button>
  <button class="zoom-btn" onclick="zoomMap(0.77)" title="Verkleinern">&minus;</button>
  <button class="zoom-btn" onclick="resetZoom()" title="Zurücksetzen" style="font-size:14px">⟲</button>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  let drivingMode = false;
  let currentZoom = 1;
  let panX = 0, panY = 0;
  let isDragging = false;
  let dragStartX, dragStartY, panStartX, panStartY;
  let currentCountry = null;

  const mapContainer = document.getElementById('map-container');
  const svg = document.getElementById('world-map');
  const countriesGroup = document.getElementById('countries-group');
  const tooltip = document.getElementById('tooltip');
  const overlay = document.getElementById('overlay');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');

  // ── Build Graticule ──
  function buildGraticule() {
    const g = document.getElementById('graticule');
    let d = '';
    // Longitude lines every 30°
    for (let lon = -180; lon <= 180; lon += 30) {
      const x = (lon + 180) * (2000 / 360);
      d += `M${x},0 L${x},1000 `;
    }
    // Latitude lines every 30°
    for (let lat = -90; lat <= 90; lat += 30) {
      const y = (90 - lat) * (1000 / 180);
      d += `M0,${y} L2000,${y} `;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.classList.add('graticule');
    g.appendChild(path);
  }

  // ── Build Map ──
  function buildMap() {
    if (typeof MAP_PATHS === 'undefined') {
      console.error('MAP_PATHS not loaded. Make sure data/map-paths.js is present.');
      return;
    }
    for (const [iso, pathD] of Object.entries(MAP_PATHS)) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('id', iso);
      path.classList.add('country');
      // Add driving side data
      const info = (typeof COUNTRIES !== 'undefined') ? COUNTRIES[iso] : null;
      if (info) {
        path.dataset.driving = info.driving || 'right';
      }
      path.addEventListener('mouseenter', (e) => showTooltip(iso, e));
      path.addEventListener('mousemove', (e) => moveTooltip(e));
      path.addEventListener('mouseleave', hideTooltip);
      path.addEventListener('click', (e) => { e.stopPropagation(); openPanel(iso); });
      countriesGroup.appendChild(path);
    }
  }

  // ── Tooltip ──
  function showTooltip(iso, e) {
    if (typeof COUNTRIES === 'undefined') return;
    const info = COUNTRIES[iso];
    if (!info) return;
    currentCountry = iso;

    // Flag
    const flagEl = document.getElementById('tooltip-flag');
    if (info.flag_image) {
      flagEl.innerHTML = `<img src="${info.flag_image}" alt="${info.name}">`;
    } else {
      flagEl.textContent = info.flag || '';
    }

    document.getElementById('tooltip-name').textContent = info.name || iso;
    document.getElementById('tooltip-tld').textContent = info.tld || '';

    const drivingText = info.driving === 'left' ? 'Linksverkehr' : 'Rechtsverkehr';
    const sideClass = info.driving === 'left' ? 'left' : 'right';
    document.getElementById('tooltip-driving').innerHTML =
      `<span class="side-icon ${sideClass}"></span>${drivingText}`;

    moveTooltip(e);
    tooltip.classList.add('show');
  }

  function moveTooltip(e) {
    const x = e.clientX + 16;
    const y = e.clientY - 10;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    const finalX = (x + tw > window.innerWidth - 10) ? e.clientX - tw - 16 : x;
    const finalY = (y + th > window.innerHeight - 10) ? e.clientY - th - 10 : y;
    tooltip.style.left = finalX + 'px';
    tooltip.style.top = finalY + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('show');
    currentCountry = null;
  }

  // ── Info Panel ──
  function openPanel(iso) {
    if (typeof COUNTRIES === 'undefined') return;
    const info = COUNTRIES[iso];
    if (!info) return;

    // Flag
    const flagEl = document.getElementById('panel-flag');
    if (info.flag_image) {
      flagEl.innerHTML = `<img src="${info.flag_image}" alt="${info.name}">`;
    } else {
      flagEl.textContent = info.flag || '';
    }

    document.getElementById('panel-title').textContent = info.name || iso;
    document.getElementById('panel-subtitle').textContent = (info.name_en || '') + (info.continent ? ' — ' + info.continent : '');

    // Build body
    let html = '<div class="info-grid">';

    // TLD
    html += `<div class="info-card">
      <div class="info-label">Webseitenendung</div>
      <div class="info-value accent">${info.tld || '—'}</div>
    </div>`;

    // Capital
    html += `<div class="info-card">
      <div class="info-label">Hauptstadt</div>
      <div class="info-value">${info.capital || '—'}</div>
    </div>`;

    // Driving side
    const drivingLabel = info.driving === 'left' ? 'Linksverkehr' : 'Rechtsverkehr';
    const drivingClass = info.driving === 'left' ? 'left' : 'right';
    const drivingIcon = info.driving === 'left'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l-7 7 7 7"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';
    html += `<div class="info-card">
      <div class="info-label">Verkehrsseite</div>
      <div class="info-value"><span class="driving-badge ${drivingClass}">${drivingIcon} ${drivingLabel}</span></div>
    </div>`;

    // ISO Code
    html += `<div class="info-card">
      <div class="info-label">ISO-Code</div>
      <div class="info-value">${iso}</div>
    </div>`;

    html += '</div>';

    // License plate image
    if (info.plate_image) {
      html += '<div class="panel-section-title">Kennzeichen</div>';
      html += `<div class="panel-plate-wrap"><img src="${info.plate_image}" alt="Kennzeichen ${info.name}"></div>`;
    }

    // Road sign image
    if (info.road_sign_image) {
      html += '<div class="panel-section-title">Straßenschilder</div>';
      html += `<div class="panel-images"><div class="panel-img-wrap"><img src="${info.road_sign_image}" alt="Straßenschilder ${info.name}"><div class="panel-img-caption">Straßenschilder — ${info.name}</div></div></div>`;
    }

    // Custom images
    if (info.custom_images && info.custom_images.length > 0) {
      html += '<div class="panel-section-title">Bilder</div>';
      html += '<div class="panel-images">';
      for (const img of info.custom_images) {
        html += `<div class="panel-img-wrap"><img src="${img.src}" alt="${img.caption || ''}"><div class="panel-img-caption">${img.caption || ''}</div></div>`;
      }
      html += '</div>';
    }

    // Additional info (HTML)
    if (info.additional_info) {
      html += '<div class="panel-section-title">Weitere Informationen</div>';
      html += `<div class="panel-additional">${info.additional_info}</div>`;
    }

    document.getElementById('panel-body').innerHTML = html;
    overlay.classList.add('open');
    // Scroll panel to top
    document.getElementById('info-panel').scrollTop = 0;
  }

  function closePanel(e, force) {
    if (force || e.target === overlay) {
      overlay.classList.remove('open');
    }
  }
  window.closePanel = closePanel;

  // ── Driving Mode Toggle ──
  window.toggleDriving = function() {
    drivingMode = !drivingMode;
    const toggle = document.getElementById('driving-toggle');
    const legend = document.getElementById('legend');
    toggle.classList.toggle('active', drivingMode);
    legend.classList.toggle('visible', drivingMode);
    mapContainer.classList.toggle('driving-mode', drivingMode);
  };

  // ── Zoom & Pan ──
  // ── Frame-Synchronisation für flüssiges Rendering ──
  let frameRequested = false;

  function updateTransform() {
    // 1. Zoom niemals unter 100% (Faktor 1) fallen lassen, sonst sieht man den Rand
    if (currentZoom < 1) currentZoom = 1;

    // 2. Erlaubten Verschiebungs-Bereich berechnen
    // Die interne SVG-Karte ist 2000x1000 Einheiten groß.
    const minX = 2000 * (1 - currentZoom);
    const minY = 1000 * (1 - currentZoom);

    // 3. Pan-Koordinaten zwingend innerhalb der Grenzen einklemmen (Clamping)
    if (panX > 0) panX = 0;
    if (panX < minX) panX = minX;
    
    if (panY > 0) panY = 0;
    if (panY < minY) panY = minY;

    // GPU-beschleunigte CSS-Transforms anwenden
    countriesGroup.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    document.getElementById('graticule').style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    frameRequested = false;
  }

  function requestTransform() {
    // Rendert nur, wenn nicht ohnehin schon ein Frame in der Warteschlange ist
    if (!frameRequested) {
      window.requestAnimationFrame(updateTransform);
      frameRequested = true;
    }
  }

  window.zoomMap = function(factor) {
    const newZoom = Math.max(1, Math.min(10, currentZoom * factor));
    // Zoom towards center
    const cx = 1000, cy = 500;
    panX = cx - (cx - panX) * (newZoom / currentZoom);
    panY = cy - (cy - panY) * (newZoom / currentZoom);
    currentZoom = newZoom;
    updateTransform();
  };

  window.resetZoom = function() {
    currentZoom = 1;
    panX = 0;
    panY = 0;
    updateTransform();
  };

  // Mouse wheel zoom
  let zoomTimeout;

  // Mouse wheel zoom
  mapContainer.addEventListener('wheel', (e) => {
    e.preventDefault();

    // 1. Hover-Effekte beim Scrollen deaktivieren
    mapContainer.classList.add('is-dragging');

    // 2. Timer zurücksetzen, solange das Rad gedreht wird
    clearTimeout(zoomTimeout);

    // 3. Wenn 150ms lang nicht mehr gescrollt wurde, Hover wieder aktivieren
    zoomTimeout = setTimeout(() => {
      mapContainer.classList.remove('is-dragging');
    }, 150);

    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const rect = svg.getBoundingClientRect();
    const svgX = (e.clientX - rect.left) / rect.width * 2000;
    const svgY = (e.clientY - rect.top) / rect.height * 1000;
    const newZoom = Math.max(1.0, Math.min(10, currentZoom * factor));
    panX = svgX - (svgX - panX) * (newZoom / currentZoom);
    panY = svgY - (svgY - panY) * (newZoom / currentZoom);
    currentZoom = newZoom;
    updateTransform();
  }, {passive: false});

  // Pan with drag
  mapContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
    // HIER NOCH KEINE KLASSE SETZEN!
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    
    // Klasse erst setzen, wenn wirklich gezogen wird
    mapContainer.classList.add('is-dragging'); 
    
    const rect = svg.getBoundingClientRect();
    const dx = (e.clientX - dragStartX) / rect.width * 2000;
    const dy = (e.clientY - dragStartY) / rect.height * 1000;
    panX = panStartX + dx;
    panY = panStartY + dy;
    updateTransform();
  });

  window.addEventListener('mouseup', () => { 
    isDragging = false; 
    // Klasse beim Loslassen wieder entfernen
    mapContainer.classList.remove('is-dragging'); 
  });

  // Touch support
  let lastTouchDist = 0;
  mapContainer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      mapContainer.classList.remove('is-dragging');
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = panX;
      panStartY = panY;
    } else if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, {passive: true});

  mapContainer.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
      
      // Klasse erst beim Wischen setzen
      mapContainer.classList.add('is-dragging');

      const rect = svg.getBoundingClientRect();
      const dx = (e.touches[0].clientX - dragStartX) / rect.width * 2000;
      const dy = (e.touches[0].clientY - dragStartY) / rect.height * 1000;
      panX = panStartX + dx;
      panY = panStartY + dy;
      updateTransform();
      
    } else if (e.touches.length === 2) {
      
      // NEU: Hover auch beim Pinch-to-Zoom deaktivieren
      mapContainer.classList.add('is-dragging');
      
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastTouchDist > 0) {
        const factor = dist / lastTouchDist;
        currentZoom = Math.max(1.0, Math.min(10, currentZoom * factor));
        updateTransform();
      }
      lastTouchDist = dist;
    }
  }, {passive: true});

  mapContainer.addEventListener('touchend', () => { 
    isDragging = false; 
    lastTouchDist = 0; 
    // Klasse beim Loslassen wieder entfernen
    mapContainer.classList.remove('is-dragging');
  });

  // ── Search ──
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (q.length < 1) { searchResults.classList.remove('open'); return; }
    if (typeof COUNTRIES === 'undefined') return;

    const matches = [];
    for (const [iso, info] of Object.entries(COUNTRIES)) {
      const searchStr = `${info.name} ${info.name_en} ${info.tld} ${iso}`.toLowerCase();
      if (searchStr.includes(q)) {
        matches.push({iso, info});
      }
    }
    if (matches.length === 0) {
      searchResults.classList.remove('open');
      return;
    }
    let html = '';
    for (const m of matches.slice(0, 8)) {
      html += `<div class="search-result-item" onclick="searchSelect('${m.iso}')">
        <span class="sr-flag">${m.info.flag || ''}</span>
        <span class="sr-name">${m.info.name}</span>
        <span class="sr-tld">${m.info.tld}</span>
      </div>`;
    }
    searchResults.innerHTML = html;
    searchResults.classList.add('open');
  });

  searchInput.addEventListener('blur', () => {
    setTimeout(() => searchResults.classList.remove('open'), 200);
  });

  window.searchSelect = function(iso) {
    searchInput.value = '';
    searchResults.classList.remove('open');
    openPanel(iso);
    // Highlight country on map briefly
    const el = document.getElementById(iso);
    if (el) {
      el.style.fill = 'var(--accent)';
      setTimeout(() => { el.style.fill = ''; }, 800);
    }
  };

  // Keyboard: Escape closes panel
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      overlay.classList.remove('open');
    }
  });

  // ── Init ──
  buildGraticule();
  buildMap();
})();
</script>

</body>
</html>
